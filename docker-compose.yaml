services:
  privcloud-sharing:
    image: simthem/privcloud-sharing:latest
    container_name: privcloud-sharing
    # build:
        # context: .
        # args:
          # Uncomment and set if building behind a proxy
          # HTTP_PROXY: http://your-proxy:3128
          # HTTPS_PROXY: http://your-proxy:3128

    restart: unless-stopped
    # Memory limit: Express buffers entire raw bodies in RAM (up to 200 MB
    # per upload chunk).  With 2-3 concurrent uploads + V8 heap + Caddy +
    # frontend SSR, the container can reach 3-4 GB RSS.
    # Set mem_limit to prevent the container from eating all host RAM
    # and triggering the OOM killer (which crashes the entire VM).
    # On an 8 GB host with WordPress + ClamAV, 4 GB is a safe ceiling.
    mem_limit: 4g
    memswap_limit: 4g  # no swap - fail fast instead of thrashing
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    # Healthcheck is defined in the Dockerfile (node fetch-based, no curl needed).
    # Do NOT override it here -- the runner image has no curl binary.
    environment:
      # - TRUST_PROXY=true  (Set to true if a reverse proxy is in front of the container)

      # -- Proxy (uncomment and set if your server accesses the internet through a proxy) --
      # - NODE_OPTIONS=--dns-result-order=ipv4first --require /opt/app/backend/node_modules/global-agent/bootstrap
      # - GLOBAL_AGENT_HTTP_PROXY=http://your-proxy:3128
      # - GLOBAL_AGENT_NO_PROXY=localhost,127.0.0.1,::1
      # - HTTP_PROXY=http://your-proxy:3128
      # - HTTPS_PROXY=http://your-proxy:3128
      # - NO_PROXY=localhost,127.0.0.1,::1

      # -- Optional collaboration limits --
      # Comment out or change these values to match your instance policy.
      - TEAM_MAX_MEMBERS=30                                # Max members per team (0 = unlimited)
      - TEAM_MAX_OWNED_TEAMS=0                             # Max owned teams per user (0 = unlimited)
      - TEAM_MAX_FOLDERS=10                                # Max shared folders per team
      # Storage limits - comment out (or remove) for NO limit (default behaviour).
      # Set to a byte value to enforce a cap (e.g. 250 GB = 250000000000).
      # - TEAM_MAX_SHARE_SIZE=250000000000                 # Max size per share (bytes)
      # - TEAM_TOTAL_STORAGE_BYTES=500000000000            # Total storage per team (bytes)
      # -- Upload performance / memory budget --
      - NODE_MAX_OLD_SPACE_SIZE=3072
      - UPLOAD_MAX_CHUNK_BYTES=50000000
      - UPLOAD_ANONYMOUS_MAX_CHUNK_BYTES=35000000
      - UPLOAD_AUTHENTICATED_MAX_CHUNK_BYTES=50000000
      - S3_MAX_CONCURRENT_UPLOADS=6
      - S3_MIN_CONCURRENT_UPLOADS=2
      - S3_MAX_CONCURRENT_PER_FILE=6
      # Direct browser S3 transfers require a bucket CORS policy for APP_URL.
      # - S3_DIRECT_BROWSER_UPLOAD_ENABLED=true
      # - S3_DIRECT_BROWSER_DOWNLOAD_ENABLED=true
      # - S3_DIRECT_BROWSER_UPLOAD_ADDRESSING_MODE=path
      # Public URL of the application
      - APP_URL=https://your-domain.example.com
      # -- PDF PAdES Signing Certificate --
      - SIGNING_CERTIFICATE_PATH=/opt/app/backend/data/signing/certificate.p12
      - SIGNING_CERTIFICATE_PASSWORD=XXXXXXXXXX
      # - SIGNING_TSA_URL=https://freetsa.org/tsr  # RFC 3161 TSA (default) -- Prod -> http://timestamp.sectigo.com
    volumes:
      - "./data:/opt/app/backend/data"
      - "./data/images:/opt/app/frontend/public/img"
